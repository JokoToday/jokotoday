name: Loyalty v2 preflight lock one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826
    paths:
      - tools/patch-loyalty-redemption-preflight-lock.cjs
      - .github/workflows/loyalty-v2-preflight-lock-once.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/loyalty-v2-staff-fulfillment-20260826

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch redemption preflight lock
        run: node tools/patch-loyalty-redemption-preflight-lock.cjs

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Preflight lock assertions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql';
          const text = fs.readFileSync(file, 'utf8');
          const lock = 'LOCK TABLE public.loyalty_redemptions IN SHARE MODE;';
          const diagnostic = 'Cannot enforce one active monetary reward per order:';
          const index = 'CREATE UNIQUE INDEX IF NOT EXISTS loyalty_redemptions_one_active_monetary_per_order_uq';
          const lockCount = text.split(lock).length - 1;
          const lockAt = text.indexOf(lock);
          const diagnosticAt = text.indexOf(diagnostic, lockAt + lock.length);
          const indexAt = text.indexOf(index, diagnosticAt + diagnostic.length);
          if (lockCount !== 1 || lockAt < 0 || diagnosticAt <= lockAt || indexAt <= diagnosticAt) {
            throw new Error(`Invalid preflight lock ordering: count=${lockCount} lock=${lockAt} diagnostic=${diagnosticAt} index=${indexAt}`);
          }
          console.log(`Validated preflight lock ordering: lock=${lockAt}, diagnostic=${diagnosticAt}, index=${indexAt}`);
          NODE

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          rm tools/patch-loyalty-redemption-preflight-lock.cjs
          rm .github/workflows/loyalty-v2-preflight-lock-once.yml
          git config user.name 'JOKO TODAY'
          git config user.email 'jokotoday@gmail.com'
          git add -A
          git commit -m 'fix: lock loyalty redemptions during index preflight'
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
