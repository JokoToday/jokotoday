name: Loyalty Staff Wiring Once

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825
    paths:
      - .github/workflows/loyalty-staff-wiring-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply exact staff redemption wiring
        shell: python
        run: |
          from pathlib import Path

          pickup = Path('src/pages/PickupDeskPage.tsx')
          text = pickup.read_text()
          old = "import { CustomerPurchaseHistory } from '../components/staff/CustomerPurchaseHistory';\n"
          new = old + "import { LoyaltyRewardRedemption } from '../components/staff/LoyaltyRewardRedemption';\n"
          if old not in text or "LoyaltyRewardRedemption" in text:
              raise SystemExit('Pickup import anchor missing or already modified')
          text = text.replace(old, new, 1)

          anchor = """                {actionError && (\n"""
          block = """                <LoyaltyRewardRedemption\n                  customerId={customer.id}\n                  currentBalance={customer.loyalty_points}\n                  channel=\"pickup\"\n                  language={staffLanguage}\n                  pickupOrders={[...orders, ...upcomingOrders]\n                    .filter((order) => order.status !== 'cancelled')\n                    .map((order) => ({\n                      id: order.id,\n                      orderNumber: order.order_number,\n                      totalAmount: Number(order.total_amount || 0),\n                      status: order.status,\n                    }))}\n                  onRedeemed={(result) => {\n                    setCustomer((current) => current\n                      ? { ...current, loyalty_points: result.new_balance }\n                      : current);\n                    setHistoryRefreshKey((value) => value + 1);\n                    setActionError(null);\n                    setActionSuccess(language === 'en'\n                      ? `${result.points_spent} loyalty points redeemed. Balance: ${result.new_balance} points.`\n                      : `แลก ${result.points_spent} แต้มแล้ว ยอดคงเหลือ ${result.new_balance} แต้ม`);\n                  }}\n                />\n\n"""
          if anchor not in text:
              raise SystemExit('Pickup render anchor missing')
          text = text.replace(anchor, block + anchor, 1)
          pickup.write_text(text)

          walkin = Path('src/pages/WalkInDeskPage.tsx')
          text = walkin.read_text()
          old = "import { CustomerPurchaseHistory } from '../components/staff/CustomerPurchaseHistory';\n"
          new = old + "import { LoyaltyRewardRedemption } from '../components/staff/LoyaltyRewardRedemption';\n"
          if old not in text or "LoyaltyRewardRedemption" in text:
              raise SystemExit('Walk-in import anchor missing or already modified')
          text = text.replace(old, new, 1)

          anchor = """                {purchaseResult ? (\n"""
          block = """                <LoyaltyRewardRedemption\n                  customerId={customer.id}\n                  currentBalance={customer.loyalty_points}\n                  channel=\"walk_in\"\n                  language={staffLanguage}\n                  contextAmount={calculationAmount}\n                  onRedeemed={(result) => {\n                    setCustomer((current) => current\n                      ? { ...current, loyalty_points: result.new_balance }\n                      : current);\n                    setHistoryRefreshKey((value) => value + 1);\n                  }}\n                />\n\n"""
          if anchor not in text:
              raise SystemExit('Walk-in render anchor missing')
          text = text.replace(anchor, block + anchor, 1)
          walkin.write_text(text)

      - name: Validate wiring
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit wiring and remove one-shot workflow
        run: |
          git config user.name "JOKO TODAY CI"
          git config user.email "jokotoday@gmail.com"
          git rm .github/workflows/loyalty-staff-wiring-once.yml
          git add src/pages/PickupDeskPage.tsx src/pages/WalkInDeskPage.tsx
          git commit -m "feat: wire staff loyalty redemption desks"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
