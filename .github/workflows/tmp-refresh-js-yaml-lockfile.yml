name: Temporary js-yaml lockfile refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh only js-yaml in lockfile
        run: npm update js-yaml --package-lock-only --ignore-scripts

      - name: Verify narrow lockfile-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          test "$(git diff --name-only)" = "package-lock.json"
          test "$(git diff --numstat -- package-lock.json)" = $'3\t3\tpackage-lock.json'
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const pkg = lock.packages?.['node_modules/js-yaml'];
          if (!pkg || pkg.version !== '4.3.2') {
            console.error('Expected js-yaml 4.3.2, found:', pkg?.version);
            process.exit(1);
          }
          NODE
          git diff --check
          git diff -- package-lock.json

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh js-yaml lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
