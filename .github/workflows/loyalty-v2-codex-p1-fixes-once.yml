name: Loyalty v2 Codex P1 fixes one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Codex P1 findings
        run: python3 scripts/patch-loyalty-review-p1s.py

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: P1 assertions
        shell: bash
        run: |
          grep -q "Customer cancelled before pickup payment" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "orderPaidAmount" src/components/staff/CustomerPurchaseHistory.tsx
          grep -q "loyalty_discount_amount, amount_paid" src/components/staff/CustomerPurchaseHistory.tsx

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-codex-p1-fixes-once.yml scripts/patch-loyalty-review-p1s.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql src/components/staff/CustomerPurchaseHistory.tsx .github/workflows/loyalty-v2-codex-p1-fixes-once.yml scripts/patch-loyalty-review-p1s.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No P1 fixes to commit"
            exit 1
          fi
          git commit -m "fix: address loyalty staff fulfillment P1s"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
