name: PR74 Final Polish

on:
  push:
    branches:
      - feature/pickup-ux-polish-2-20260902
    paths:
      - .github/workflows/pr74-final-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pickup-ux-polish-2-20260902
          fetch-depth: 0

      - name: Apply surgical polish
        run: |
          python - <<'PY'
          from pathlib import Path

          selector = Path('src/components/PickupDateSelectorV2.tsx')
          text = selector.read_text()
          old = """      if (activeDateId === null) setActiveDateId(value.pickupDateId);\n      setVisibleMonth(monthStart(utcDateFromKey(value.pickupDate)));"""
          new = """      if (activeDateId === null) {\n        setActiveDateId(value.pickupDateId);\n        setVisibleMonth(monthStart(utcDateFromKey(value.pickupDate)));\n      } else if (activeDateId === value.pickupDateId) {\n        setVisibleMonth(monthStart(utcDateFromKey(value.pickupDate)));\n      }"""
          if old not in text:
              raise SystemExit('PickupDateSelector target not found')
          selector.write_text(text.replace(old, new, 1))

          availability = Path('src/lib/pickupAvailabilityV2.ts')
          text = availability.read_text()
          old = 'Could not load Pickup v2 availability:'
          new = 'Could not load pickup availability:'
          if old not in text:
              raise SystemExit('pickupAvailabilityV2 target not found')
          availability.write_text(text.replace(old, new, 1))

          Path('.github/workflows/pr74-final-polish.yml').unlink()
          PY

      - name: Commit final polish and remove helper
        run: |
          git config user.name "JOKO TODAY CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish pickup draft navigation and customer copy"
          git push origin HEAD:feature/pickup-ux-polish-2-20260902
