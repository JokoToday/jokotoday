name: Loyalty Walk-In Order ID Guard Once

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825

permissions:
  contents: write

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require persisted order id in walk-in purchase response
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/WalkInDeskPage.tsx')
          s = p.read_text()
          old = """      if (\n        !data\n        || typeof data.amount !== 'number'\n        || typeof data.points_earned !== 'number'\n        || typeof data.updated_balance !== 'number'\n      ) {"""
          new = """      if (\n        !data\n        || typeof data.order_id !== 'string'\n        || data.order_id.length === 0\n        || typeof data.amount !== 'number'\n        || typeof data.points_earned !== 'number'\n        || typeof data.updated_balance !== 'number'\n      ) {"""
          if old not in s:
              raise SystemExit('walk-in response validation target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/loyalty-walkin-orderid-guard-once.yml
          git config user.name "JOKO TODAY"
          git config user.email "jokotoday@gmail.com"
          git add src/pages/WalkInDeskPage.tsx .github/workflows/loyalty-walkin-orderid-guard-once.yml
          git commit -m "fix: validate persisted walk-in order before rewards"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
