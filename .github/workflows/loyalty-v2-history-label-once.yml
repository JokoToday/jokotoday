name: Loyalty v2 history amount-label one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch history amount label
        run: python3 scripts/patch-loyalty-history-amount-label.py

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Amount-label assertions
        shell: bash
        run: |
          grep -q "Amount due" src/components/staff/CustomerPurchaseHistory.tsx
          grep -q "order.payment_status === 'paid'" src/components/staff/CustomerPurchaseHistory.tsx

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-history-label-once.yml scripts/patch-loyalty-history-amount-label.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/staff/CustomerPurchaseHistory.tsx .github/workflows/loyalty-v2-history-label-once.yml scripts/patch-loyalty-history-amount-label.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No history amount-label changes to commit"
            exit 1
          fi
          git commit -m "fix: distinguish unpaid amount due in history"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
