name: Loyalty v2 duplicate redemption preflight one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch duplicate-redemption preflight
        run: python3 scripts/patch-loyalty-duplicate-redemption-preflight.py

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Preflight assertions
        shell: bash
        run: |
          grep -q "Cannot enforce one active monetary reward per order" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "v_duplicate_order_count" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "LIMIT 20" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "CREATE UNIQUE INDEX IF NOT EXISTS loyalty_redemptions_one_active_monetary_per_order_uq" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-duplicate-preflight-once.yml scripts/patch-loyalty-duplicate-redemption-preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql .github/workflows/loyalty-v2-duplicate-preflight-once.yml scripts/patch-loyalty-duplicate-redemption-preflight.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No duplicate-redemption preflight change to commit"
            exit 1
          fi
          git commit -m "fix: diagnose duplicate monetary redemptions before index"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
