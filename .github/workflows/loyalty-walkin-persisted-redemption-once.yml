name: Loyalty Walk-In Persisted Redemption Once

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825
    paths:
      - .github/workflows/loyalty-walkin-persisted-redemption-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require persisted walk-in sale for redemption
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path('src/components/staff/LoyaltyRewardRedemption.tsx')
          text = component.read_text()
          old = """  contextAmount?: number | null;\n  pickupOrders?: PickupOrderOption[];"""
          new = """  contextAmount?: number | null;\n  walkInOrderId?: string | null;\n  pickupOrders?: PickupOrderOption[];"""
          if old not in text: raise SystemExit('component props target missing')
          text = text.replace(old, new, 1)

          old = """  contextAmount = null,\n  pickupOrders = [],"""
          new = """  contextAmount = null,\n  walkInOrderId = null,\n  pickupOrders = [],"""
          if old not in text: raise SystemExit('component destructure target missing')
          text = text.replace(old, new, 1)

          old = """  useEffect(() => {\n    requestKeyRef.current = null;\n  }, [selectedRewardId, selectedOrderId, contextAmount]);"""
          new = """  useEffect(() => {\n    requestKeyRef.current = null;\n  }, [selectedRewardId, selectedOrderId, contextAmount, walkInOrderId]);"""
          if old not in text: raise SystemExit('request reset target missing')
          text = text.replace(old, new, 1)

          old = """  const monetaryContextMissing = Boolean(\n    selectedReward\n    && ['fixed_discount', 'percentage_discount'].includes(selectedReward.reward_type)\n    && (channel === 'pickup' ? !selectedOrder : Number(contextAmount || 0) <= 0)\n  );"""
          new = """  const monetaryContextMissing = Boolean(\n    selectedReward\n    && ['fixed_discount', 'percentage_discount'].includes(selectedReward.reward_type)\n    && (channel === 'pickup' ? !selectedOrder : !walkInOrderId)\n  );"""
          if old not in text: raise SystemExit('monetary context target missing')
          text = text.replace(old, new, 1)

          old = """        p_order_id: channel === 'pickup' ? (selectedOrder?.id || null) : null,\n        p_context_amount: channel === 'walk_in' ? Number(contextAmount || 0) : null,"""
          new = """        p_order_id: channel === 'pickup' ? (selectedOrder?.id || null) : walkInOrderId,\n        // Walk-In amount is display-only here. The RPC derives the authoritative\n        // value from the persisted walk-in order selected above.\n        p_context_amount: null,"""
          if old not in text: raise SystemExit('RPC args target missing')
          text = text.replace(old, new, 1)
          component.write_text(text)

          page = Path('src/pages/WalkInDeskPage.tsx')
          text = page.read_text()
          old = """interface PurchaseResult {\n  order_number: string;"""
          new = """interface PurchaseResult {\n  order_id: string;\n  order_number: string;"""
          if old not in text: raise SystemExit('purchase result interface target missing')
          text = text.replace(old, new, 1)

          old_panel = """                <LoyaltyRewardRedemption\n                  customerId={customer.id}\n                  currentBalance={customer.loyalty_points}\n                  channel=\"walk_in\"\n                  language={staffLanguage}\n                  contextAmount={calculationAmount}\n                  onRedeemed={(result) => {\n                    setCustomer((current) => current\n                      ? { ...current, loyalty_points: result.new_balance }\n                      : current);\n                    setHistoryRefreshKey((value) => value + 1);\n                  }}\n                />\n\n"""
          if old_panel not in text: raise SystemExit('old walk-in redemption panel target missing')
          text = text.replace(old_panel, '', 1)

          marker = """                    <div className=\"space-y-3\">\n                      <button type=\"button\" onClick={handleAnotherPurchase}"""
          panel = """                    <LoyaltyRewardRedemption\n                      customerId={customer.id}\n                      currentBalance={customer.loyalty_points}\n                      channel=\"walk_in\"\n                      language={staffLanguage}\n                      contextAmount={purchaseResult.amount}\n                      walkInOrderId={purchaseResult.order_id}\n                      onRedeemed={(result) => {\n                        setCustomer((current) => current\n                          ? { ...current, loyalty_points: result.new_balance }\n                          : current);\n                        setHistoryRefreshKey((value) => value + 1);\n                      }}\n                    />\n\n                    <div className=\"space-y-3\">\n                      <button type=\"button\" onClick={handleAnotherPurchase}"""
          if marker not in text: raise SystemExit('purchase result insertion target missing')
          text = text.replace(marker, panel, 1)
          page.write_text(text)

          migration = Path('supabase/migrations/20260825173100_loyalty_v2_staff_redemption_hardening.sql')
          text = migration.read_text()
          old = """  IF p_order_id IS NOT NULL THEN\n    SELECT * INTO v_order\n    FROM public.orders\n    WHERE id = p_order_id\n    FOR SHARE;\n    IF NOT FOUND THEN RAISE EXCEPTION 'Order not found'; END IF;\n    IF v_order.customer_id IS DISTINCT FROM p_customer_id THEN\n      RAISE EXCEPTION 'Order does not belong to this customer';\n    END IF;\n    IF v_order.status = 'cancelled' THEN\n      RAISE EXCEPTION 'Cannot redeem against a cancelled order';\n    END IF;\n    IF p_channel = 'pickup' AND COALESCE(v_order.purchase_type, 'online') <> 'online' THEN\n      RAISE EXCEPTION 'Pickup redemption requires an online/pickup order';\n    END IF;\n    v_context_amount := COALESCE(v_order.total_amount, 0);\n  END IF;"""
          new = """  IF p_channel = 'walk_in' AND p_order_id IS NULL THEN\n    RAISE EXCEPTION 'Walk-in redemption requires a persisted sale';\n  END IF;\n\n  IF p_order_id IS NOT NULL THEN\n    SELECT * INTO v_order\n    FROM public.orders\n    WHERE id = p_order_id\n    FOR SHARE;\n    IF NOT FOUND THEN RAISE EXCEPTION 'Order not found'; END IF;\n    IF v_order.customer_id IS DISTINCT FROM p_customer_id THEN\n      RAISE EXCEPTION 'Order does not belong to this customer';\n    END IF;\n    IF v_order.status = 'cancelled' THEN\n      RAISE EXCEPTION 'Cannot redeem against a cancelled order';\n    END IF;\n    IF p_channel = 'pickup' AND COALESCE(v_order.purchase_type, 'online') <> 'online' THEN\n      RAISE EXCEPTION 'Pickup redemption requires an online/pickup order';\n    END IF;\n    IF p_channel = 'walk_in' THEN\n      IF v_order.purchase_type IS DISTINCT FROM 'walk_in'\n         OR v_order.status IS DISTINCT FROM 'completed'\n         OR v_order.payment_status IS DISTINCT FROM 'paid' THEN\n        RAISE EXCEPTION 'Walk-in redemption requires a completed paid walk-in sale';\n      END IF;\n    END IF;\n    -- Authoritative reward context always comes from the persisted order.\n    -- p_context_amount is retained only for signature compatibility and is never\n    -- trusted for eligibility or monetary valuation.\n    v_context_amount := COALESCE(v_order.total_amount, 0);\n  END IF;"""
          if old not in text: raise SystemExit('staff persisted order target missing')
          text = text.replace(old, new, 1)
          migration.write_text(text)

          audit = Path('supabase/audits/20260825_loyalty_v2_post_apply.sql')
          text = audit.read_text()
          old = """  pg_get_functiondef(p.oid) ILIKE '%auth.uid()%' AS has_authenticated_actor_guard,\n  p.prosecdef AS security_definer,"""
          new = """  pg_get_functiondef(p.oid) ILIKE '%auth.uid()%' AS has_authenticated_actor_guard,\n  pg_get_functiondef(p.oid) ILIKE '%Walk-in redemption requires a persisted sale%' AS has_persisted_walk_in_guard,\n  p.prosecdef AS security_definer,"""
          if old not in text: raise SystemExit('audit staff guard target missing')
          text = text.replace(old, new, 1)
          old = """-- Expected: one row, both guards=true, security_definer=true,\n-- function_config contains search_path=public."""
          new = """-- Expected: one row, both identity guards=true, persisted-walk-in guard=true,\n-- security_definer=true, function_config contains search_path=public."""
          if old not in text: raise SystemExit('audit expected target missing')
          text = text.replace(old, new, 1)
          audit.write_text(text)
          PY
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/loyalty-walkin-persisted-redemption-once.yml
          git config user.name "JOKO TODAY"
          git config user.email "jokotoday@gmail.com"
          git add src/components/staff/LoyaltyRewardRedemption.tsx \
                  src/pages/WalkInDeskPage.tsx \
                  supabase/migrations/20260825173100_loyalty_v2_staff_redemption_hardening.sql \
                  supabase/audits/20260825_loyalty_v2_post_apply.sql \
                  .github/workflows/loyalty-walkin-persisted-redemption-once.yml
          git commit -m "fix: require persisted walk-in sale for rewards"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
