name: Loyalty Final Review Hardening Once

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825
    paths:
      - .github/workflows/loyalty-final-review-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact final-review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          foundation = Path('supabase/migrations/20260825172000_loyalty_v2_foundation.sql')
          text = foundation.read_text()
          old = """      (reward_type = 'fixed_discount'\n        AND fixed_discount_amount IS NOT NULL AND fixed_discount_amount > 0\n        AND percentage_discount IS NULL AND product_id IS NULL)"""
          new = """      (reward_type = 'fixed_discount'\n        AND fixed_discount_amount IS NOT NULL AND fixed_discount_amount > 0\n        AND percentage_discount IS NULL AND max_discount_amount IS NULL AND product_id IS NULL)"""
          if old not in text:
              raise SystemExit('foundation fixed-discount constraint target not found')
          text = text.replace(old, new, 1)

          old = """  IF p_reward_type = 'fixed_discount' THEN\n    IF p_fixed_discount_amount IS NULL OR p_fixed_discount_amount <= 0\n       OR p_percentage_discount IS NOT NULL OR p_product_id IS NOT NULL THEN"""
          new = """  IF p_reward_type = 'fixed_discount' THEN\n    IF p_fixed_discount_amount IS NULL OR p_fixed_discount_amount <= 0\n       OR p_percentage_discount IS NOT NULL OR p_max_discount_amount IS NOT NULL OR p_product_id IS NOT NULL THEN"""
          if old not in text:
              raise SystemExit('foundation fixed-discount RPC target not found')
          text = text.replace(old, new, 1)

          pattern = re.compile(r"-- Every existing positive-point order was created under the legacy model where\n.*?ON CONFLICT DO NOTHING;\n", re.S)
          replacement = """-- Historical award markers and opening-ledger rows are intentionally created only\n-- by 20260825172500_loyalty_v2_earning_lifecycle.sql inside one locked atomic\n-- cutover. Keeping the foundation schema-only avoids a commit-to-commit window\n-- where the legacy insert trigger could credit an order without an award marker.\n"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'foundation cutover block replacement count={count}')
          foundation.write_text(text)

          lifecycle = Path('supabase/migrations/20260825172500_loyalty_v2_earning_lifecycle.sql')
          text = lifecycle.read_text()
          text = text.replace(
              "  v_order public.orders%ROWTYPE;\n  v_existing_earn_at timestamptz;",
              "  v_order public.orders%ROWTYPE;\n  v_customer_id uuid;\n  v_existing_earn_at timestamptz;",
              1,
          )
          old = """  SELECT *\n  INTO v_order\n  FROM public.orders\n  WHERE id = p_order_id\n  FOR UPDATE;\n\n  IF NOT FOUND THEN\n    RAISE EXCEPTION 'Order not found';\n  END IF;\n\n  IF v_order.status = 'cancelled' THEN"""
          new = """  -- Canonical lock order for customer orders is customer -> order. This matches\n  -- v2 cancellation and prevents pickup/cancellation deadlocks.\n  SELECT o.customer_id\n  INTO v_customer_id\n  FROM public.orders o\n  WHERE o.id = p_order_id;\n\n  IF NOT FOUND THEN\n    RAISE EXCEPTION 'Order not found';\n  END IF;\n\n  IF v_customer_id IS NOT NULL THEN\n    PERFORM 1\n    FROM public.customers c\n    WHERE c.id = v_customer_id\n    FOR UPDATE;\n    IF NOT FOUND THEN RAISE EXCEPTION 'Customer record not found'; END IF;\n  END IF;\n\n  SELECT *\n  INTO v_order\n  FROM public.orders\n  WHERE id = p_order_id\n  FOR UPDATE;\n\n  IF NOT FOUND THEN\n    RAISE EXCEPTION 'Order not found';\n  END IF;\n  IF v_order.customer_id IS DISTINCT FROM v_customer_id THEN\n    RAISE EXCEPTION 'Order customer changed while confirming pickup; retry';\n  END IF;\n\n  IF v_order.status = 'cancelled' THEN"""
          if old not in text:
              raise SystemExit('confirm pickup lock target not found')
          text = text.replace(old, new, 1)

          old = """  SELECT * INTO v_order FROM public.orders WHERE id = p_order_id FOR UPDATE;\n  IF NOT FOUND THEN RAISE EXCEPTION 'Order not found'; END IF;\n  IF v_order.customer_id IS DISTINCT FROM v_user_id THEN RAISE EXCEPTION 'You may only cancel your own order' USING ERRCODE = '42501'; END IF;\n  IF COALESCE(v_order.purchase_type, 'online') <> 'online' THEN RAISE EXCEPTION 'Only online orders can be cancelled here'; END IF;\n  IF v_order.status = 'cancelled' THEN RETURN to_jsonb(v_order); END IF;\n  IF v_order.status NOT IN ('pending', 'confirmed') THEN RAISE EXCEPTION 'This order can no longer be cancelled'; END IF;\n  IF COALESCE(v_order.payment_status, 'unpaid') <> 'unpaid' OR v_order.picked_up_at IS NOT NULL THEN RAISE EXCEPTION 'Paid or picked-up orders require staff assistance to cancel'; END IF;\n  IF v_order.pickup_date IS NULL THEN RAISE EXCEPTION 'Order has no scheduled pickup date'; END IF;\n\n  SELECT * INTO v_customer FROM public.customers WHERE id = v_order.customer_id FOR UPDATE;\n  IF NOT FOUND THEN RAISE EXCEPTION 'Customer record not found'; END IF;"""
          new = """  -- Match the canonical customer -> order lock order used by v2 cancellation and\n  -- pickup confirmation. The helper also independently rejects v2 orders.\n  SELECT * INTO v_customer FROM public.customers WHERE id = v_user_id FOR UPDATE;\n  IF NOT FOUND THEN RAISE EXCEPTION 'Customer record not found'; END IF;\n\n  SELECT * INTO v_order FROM public.orders WHERE id = p_order_id FOR UPDATE;\n  IF NOT FOUND THEN RAISE EXCEPTION 'Order not found'; END IF;\n  IF v_order.customer_id IS DISTINCT FROM v_user_id THEN RAISE EXCEPTION 'You may only cancel your own order' USING ERRCODE = '42501'; END IF;\n  IF COALESCE(v_order.purchase_type, 'online') <> 'online' THEN RAISE EXCEPTION 'Only online orders can be cancelled here'; END IF;\n  IF v_order.pickup_date_id IS NOT NULL THEN\n    RAISE EXCEPTION 'Pickup v2 orders cannot use the legacy cancellation helper' USING ERRCODE = 'P0001';\n  END IF;\n  IF v_order.status = 'cancelled' THEN RETURN to_jsonb(v_order); END IF;\n  IF v_order.status NOT IN ('pending', 'confirmed') THEN RAISE EXCEPTION 'This order can no longer be cancelled'; END IF;\n  IF COALESCE(v_order.payment_status, 'unpaid') <> 'unpaid' OR v_order.picked_up_at IS NOT NULL THEN RAISE EXCEPTION 'Paid or picked-up orders require staff assistance to cancel'; END IF;\n  IF v_order.pickup_date IS NULL THEN RAISE EXCEPTION 'Order has no scheduled pickup date'; END IF;"""
          if old not in text:
              raise SystemExit('legacy cancel lock target not found')
          text = text.replace(old, new, 1)

          old = """REVOKE ALL ON FUNCTION public.cancel_online_order_legacy_v1(uuid) FROM PUBLIC, anon;\nGRANT EXECUTE ON FUNCTION public.cancel_online_order_legacy_v1(uuid) TO authenticated;"""
          new = """-- Internal helper: customers must use the guarded cancel_online_order wrapper.\nREVOKE ALL ON FUNCTION public.cancel_online_order_legacy_v1(uuid) FROM PUBLIC, anon, authenticated;"""
          if old not in text:
              raise SystemExit('legacy helper grant target not found')
          text = text.replace(old, new, 1)

          old = """    FROM public.orders o\n    WHERE o.id = p_order_id\n    FOR UPDATE;"""
          new = """    FROM public.orders o\n    WHERE o.id = p_order_id;"""
          if old not in text:
              raise SystemExit('legacy wrapper lock target not found')
          text = text.replace(old, new, 1)
          lifecycle.write_text(text)

          redemption = Path('supabase/migrations/20260825173100_loyalty_v2_staff_redemption_hardening.sql')
          text = redemption.read_text()
          reward_then_order = """  -- Exclusive reward lock protects the global redemption limit against\n  -- concurrent redemptions by different customers.\n  SELECT * INTO v_reward\n  FROM public.loyalty_rewards\n  WHERE id = p_reward_id\n  FOR UPDATE;\n  IF NOT FOUND THEN RAISE EXCEPTION 'Reward not found'; END IF;\n\n  IF NOT v_reward.is_active\n     OR (v_reward.starts_at IS NOT NULL AND v_reward.starts_at > now())\n     OR (v_reward.ends_at IS NOT NULL AND v_reward.ends_at <= now()) THEN\n    RAISE EXCEPTION 'Reward is not currently available';\n  END IF;\n  IF NOT (p_channel = ANY(v_reward.channels)) THEN\n    RAISE EXCEPTION 'Reward is not available for this channel';\n  END IF;\n\n  IF p_order_id IS NOT NULL THEN\n    SELECT * INTO v_order\n    FROM public.orders\n    WHERE id = p_order_id\n    FOR SHARE;\n    IF NOT FOUND THEN RAISE EXCEPTION 'Order not found'; END IF;\n    IF v_order.customer_id IS DISTINCT FROM p_customer_id THEN\n      RAISE EXCEPTION 'Order does not belong to this customer';\n    END IF;\n    IF v_order.status = 'cancelled' THEN\n      RAISE EXCEPTION 'Cannot redeem against a cancelled order';\n    END IF;\n    IF p_channel = 'pickup' AND COALESCE(v_order.purchase_type, 'online') <> 'online' THEN\n      RAISE EXCEPTION 'Pickup redemption requires an online/pickup order';\n    END IF;\n    v_context_amount := COALESCE(v_order.total_amount, 0);\n  END IF;"""
          order_then_reward = """  -- Customer is already locked. Lock an attached order next so all customer/order\n  -- operations follow the same customer -> order sequence as cancellation/pickup.\n  IF p_order_id IS NOT NULL THEN\n    SELECT * INTO v_order\n    FROM public.orders\n    WHERE id = p_order_id\n    FOR SHARE;\n    IF NOT FOUND THEN RAISE EXCEPTION 'Order not found'; END IF;\n    IF v_order.customer_id IS DISTINCT FROM p_customer_id THEN\n      RAISE EXCEPTION 'Order does not belong to this customer';\n    END IF;\n    IF v_order.status = 'cancelled' THEN\n      RAISE EXCEPTION 'Cannot redeem against a cancelled order';\n    END IF;\n    IF p_channel = 'pickup' AND COALESCE(v_order.purchase_type, 'online') <> 'online' THEN\n      RAISE EXCEPTION 'Pickup redemption requires an online/pickup order';\n    END IF;\n    v_context_amount := COALESCE(v_order.total_amount, 0);\n  END IF;\n\n  -- Exclusive reward lock protects the global redemption limit against\n  -- concurrent redemptions by different customers.\n  SELECT * INTO v_reward\n  FROM public.loyalty_rewards\n  WHERE id = p_reward_id\n  FOR UPDATE;\n  IF NOT FOUND THEN RAISE EXCEPTION 'Reward not found'; END IF;\n\n  IF NOT v_reward.is_active\n     OR (v_reward.starts_at IS NOT NULL AND v_reward.starts_at > now())\n     OR (v_reward.ends_at IS NOT NULL AND v_reward.ends_at <= now()) THEN\n    RAISE EXCEPTION 'Reward is not currently available';\n  END IF;\n  IF NOT (p_channel = ANY(v_reward.channels)) THEN\n    RAISE EXCEPTION 'Reward is not available for this channel';\n  END IF;"""
          if reward_then_order not in text:
              raise SystemExit('staff redemption lock-order target not found')
          text = text.replace(reward_then_order, order_then_reward, 1)
          redemption.write_text(text)

          audit = Path('supabase/audits/20260825_loyalty_v2_post_apply.sql')
          text = audit.read_text()
          insert_after = """-- Expected: zero rows.\n\n-- 12. Pickup v2 customer rollout gates must remain unchanged/dark."""
          replacement = """-- Expected: zero rows.\n\n-- 11c. Retry-safe staff redemption. request_key must be unique and only the\n-- six-argument hardened staff RPC may exist.\nSELECT request_key, COUNT(*) AS redemption_count\nFROM public.loyalty_redemptions\nWHERE request_key IS NOT NULL\nGROUP BY request_key\nHAVING COUNT(*) > 1;\n\n-- Expected: zero rows.\n\nSELECT\n  p.proname,\n  pg_get_function_identity_arguments(p.oid) AS arguments\nFROM pg_proc p\nJOIN pg_namespace n ON n.oid = p.pronamespace\nWHERE n.nspname = 'public'\n  AND p.proname = 'staff_redeem_loyalty_reward_v2'\nORDER BY arguments;\n\n-- Expected: exactly one row and arguments include p_request_key uuid.\n\n-- 11d. The legacy cancellation helper must remain dark; only the guarded wrapper\n-- may be customer-executable.\nSELECT\n  p.proname,\n  has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_execute,\n  has_function_privilege('authenticated', p.oid, 'EXECUTE') AS authenticated_execute,\n  has_function_privilege('public', p.oid, 'EXECUTE') AS public_execute\nFROM pg_proc p\nJOIN pg_namespace n ON n.oid = p.pronamespace\nWHERE n.nspname = 'public'\n  AND p.proname IN ('cancel_online_order', 'cancel_online_order_legacy_v1')\nORDER BY p.proname;\n\n-- Expected:\n-- - cancel_online_order: authenticated=true, anon/public=false\n-- - cancel_online_order_legacy_v1: authenticated/anon/public=false\n\n-- 12. Pickup v2 customer rollout gates must remain unchanged/dark."""
          if insert_after not in text:
              raise SystemExit('audit insertion target not found')
          text = text.replace(insert_after, replacement, 1)

          old = """FROM public.loyalty_rewards\nORDER BY sort_order, points_required, reward_key;"""
          new = """FROM public.loyalty_rewards\nORDER BY sort_order, points_required, reward_key;\n\n-- Fixed-discount rewards must never carry a percentage-only maximum cap.\nSELECT id, reward_key, max_discount_amount\nFROM public.loyalty_rewards\nWHERE reward_type = 'fixed_discount'\n  AND max_discount_amount IS NOT NULL;\n\n-- Expected: zero rows."""
          if old not in text:
              raise SystemExit('audit reward sanity target not found')
          text = text.replace(old, new, 1)
          audit.write_text(text)
          PY
      - name: Validate exact changes
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M ' || true)" || true
      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/loyalty-final-review-hardening-once.yml
          git config user.name "JOKO TODAY"
          git config user.email "jokotoday@gmail.com"
          git add supabase/migrations/20260825172000_loyalty_v2_foundation.sql \
                  supabase/migrations/20260825172500_loyalty_v2_earning_lifecycle.sql \
                  supabase/migrations/20260825173100_loyalty_v2_staff_redemption_hardening.sql \
                  supabase/audits/20260825_loyalty_v2_post_apply.sql \
                  .github/workflows/loyalty-final-review-hardening-once.yml
          git commit -m "fix: close loyalty v2 review gaps"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
