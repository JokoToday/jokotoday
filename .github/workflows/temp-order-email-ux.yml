name: Temporary order email UX patch

on:
  push:
    branches:
      - fix/sec005-order-email-sender-domain

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec005-order-email-sender-domain

      - name: Apply deterministic patch
        run: python .github/temp-order-email-ux.py

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf 'Changed files:\n'
          git diff --name-only
          expected=$(printf '%s\n' \
            src/pages/PickupDeskPage.tsx \
            src/pages/StaffLoginPage.tsx \
            src/pages/WalkInDeskPage.tsx \
            supabase/functions/send-admin-order-notification/index.ts \
            supabase/functions/send-order-confirmation/index.ts | sort)
          actual=$(git diff --name-only | grep -v '^\.github/' | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected changed-file set.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/pages/PickupDeskPage.tsx \
            src/pages/StaffLoginPage.tsx \
            src/pages/WalkInDeskPage.tsx \
            supabase/functions/send-admin-order-notification/index.ts \
            supabase/functions/send-order-confirmation/index.ts
          git commit -m 'feat: improve order email staff workflows'
          git push origin HEAD:fix/sec005-order-email-sender-domain
