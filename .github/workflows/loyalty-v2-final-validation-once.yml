name: Loyalty v2 final validation one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  validate-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Loyalty fulfillment assertions
        shell: bash
        run: |
          grep -q "record_walk_in_purchase_v2(uuid, numeric, text, uuid, uuid, text)" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "p_payment_method: paymentMethod" src/pages/WalkInDeskPage.tsx
          grep -q "staff_repair_completed_order_payment_method_v2" src/components/staff/CustomerPurchaseHistory.tsx
          grep -q "o.payment_method IS NULL OR o.payment_method NOT IN" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql
          grep -q "record_walk_in_purchase_v2(uuid,numeric,text,uuid,uuid,text)" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql
          grep -q "anon_payment_repair_execute_expected_false" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-final-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/loyalty-v2-final-validation-once.yml
          git diff --cached --check
          git commit -m "chore: remove loyalty v2 final validation helper"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
