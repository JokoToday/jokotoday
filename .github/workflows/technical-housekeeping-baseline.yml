name: Frontend Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Design system source audit
        run: npm run audit:design-system

      - name: Static asset egress audit
        run: npm run audit:static-assets

      - name: LINE OAuth safety contract
        run: npm run audit:line-auth

      - name: LINE onboarding contract
        run: npm run audit:line-onboarding

      - name: Authentication email hook contract
        run: npm run audit:auth-email-hook

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Tailwind v4 visual compatibility contract
        run: npm run audit:tailwind-compat

      - name: Dependency audit
        run: npm audit --audit-level=high
