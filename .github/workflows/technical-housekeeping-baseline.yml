name: Frontend Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Design system source audit
        run: npm run audit:design-system

      - name: Static asset egress audit
        run: npm run audit:static-assets

      - name: LINE OAuth safety contract
        run: npm run audit:line-auth

      - name: LINE onboarding contract
        run: npm run audit:line-onboarding

      - name: Authentication email hook contract
        run: npm run audit:auth-email-hook

      - name: LINE Official Account friendship contract
        run: npm run audit:line-friendship

      - name: Makers PostgreSQL regression tests
        run: |
          npm install --prefix /tmp/joko-makers-tests --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          JOKO_TEST_PGLITE_MODULE=/tmp/joko-makers-tests/node_modules/@electric-sql/pglite/dist/index.js node scripts/tests/makers-db.mjs

      - name: Specials receipt and Stripe contract regressions
        run: |
          npm install --prefix /tmp/joko-specials-tests --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8 stripe@22.6.0
          PGLITE_MODULE=/tmp/joko-specials-tests/node_modules/@electric-sql/pglite/dist/index.js node scripts/test-specials-receipt-compatibility.mjs
          STRIPE_MODULE=/tmp/joko-specials-tests/node_modules/stripe/esm/stripe.esm.node.js node scripts/test-specials-stripe-contract.mjs
          STRIPE_MODULE=/tmp/joko-specials-tests/node_modules/stripe/esm/stripe.esm.node.js node scripts/test-specials-stripe-edge.mjs

      - name: Payment confirmation email regression
        run: node scripts/test-payment-confirmation-email.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Tailwind v4 visual compatibility contract
        run: npm run audit:tailwind-compat

      - name: Dependency audit
        run: npm audit --audit-level=high
