name: Loyalty Walk-In Rate Once

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825
    paths:
      - .github/workflows/loyalty-walkin-rate-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Use canonical points-per-baht in Walk-In preview
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/WalkInDeskPage.tsx')
          text = path.read_text()
          text = text.replace(
              "  const [loyaltyMultiplier, setLoyaltyMultiplier] = useState(0.5);",
              "  const [loyaltyMultiplier, setLoyaltyMultiplier] = useState(0);",
              1,
          )
          text = text.replace(
              ".select('multiplier')\n        .eq('purchase_type', 'walk_in')",
              ".select('points_per_baht')\n        .eq('purchase_type', 'walk_in')",
              1,
          )
          text = text.replace(
              "      if (loyaltyData) setLoyaltyMultiplier(loyaltyData.multiplier);",
              "      if (loyaltyData) setLoyaltyMultiplier(Number(loyaltyData.points_per_baht ?? 0));",
              1,
          )
          if "select('points_per_baht')" not in text or "loyaltyData.points_per_baht" not in text:
              raise SystemExit('canonical rate patch did not apply')
          path.write_text(text)
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "JOKO TODAY CI"
          git config user.email "jokotoday@gmail.com"
          git rm .github/workflows/loyalty-walkin-rate-once.yml
          git add src/pages/WalkInDeskPage.tsx
          git commit -m "fix: use canonical walk-in loyalty rate"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
