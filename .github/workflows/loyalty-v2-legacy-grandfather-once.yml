name: Loyalty v2 legacy grandfather one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch legacy loyalty transition
        run: python3 scripts/patch-loyalty-legacy-grandfather.py

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Transition assertions
        shell: bash
        run: |
          grep -q "loyalty_earning_grandfathered" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "IF v_order.loyalty_points_awarded_at IS NULL THEN" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "legacy_awarded_discount_missing_grandfather_marker" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-legacy-grandfather-once.yml scripts/patch-loyalty-legacy-grandfather.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql .github/workflows/loyalty-v2-legacy-grandfather-once.yml scripts/patch-loyalty-legacy-grandfather.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No grandfathering changes to commit"
            exit 1
          fi
          git commit -m "fix: grandfather legacy-issued loyalty earnings"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
