name: Loyalty v2 final consistency one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Loyalty branch
        uses: actions/checkout@v7
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply scoped consistency patch
        run: node tools/patch-loyalty-final-consistency.cjs

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Targeted Loyalty assertions
        run: |
          grep -F "event_sequence bigint GENERATED ALWAYS AS IDENTITY" supabase/migrations/20260825172000_loyalty_v2_foundation.sql
          grep -F "WHEN v_purchase_type = 'walk_in' AND NEW.amount_paid IS NOT NULL" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -F "v_points_earned := COALESCE(v_order.loyalty_points_earned, 0);" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -F "ORDER BY e.customer_id, e.event_sequence DESC" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql
          grep -F "AND COALESCE(o.purchase_type, 'online') = 'online'" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql
          ! grep -R -F "ORDER BY e.customer_id, e.created_at DESC, e.id DESC" supabase/audits

      - name: Remove one-shot helpers and commit
        run: |
          rm -f tools/patch-loyalty-final-consistency.cjs
          rm -f .github/workflows/loyalty-v2-final-consistency-once.yml
          git config user.name "JOKO TODAY"
          git config user.email "jokotoday@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit" >&2
            exit 1
          fi
          git commit -m "fix: close loyalty v2 consistency gaps"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
