name: Temporary Lockfile Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only

      - name: Verify zero vulnerabilities
        run: npm audit

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
