name: Temporary Lockfile Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only

      - name: Verify zero vulnerabilities
        run: npm audit

      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh audited transitive dependencies"
          git push origin HEAD:${{ github.head_ref }}
