name: Loyalty v2 cutover ordering one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-foundation-20260825
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Loyalty branch
        uses: actions/checkout@v7
        with:
          ref: feat/loyalty-v2-foundation-20260825
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply cutover ordering and audit patch
        run: node tools/patch-loyalty-cutover-order-and-audit.cjs

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Targeted Loyalty assertions
        run: |
          grep -F "FROM PUBLIC, anon, authenticated;" supabase/migrations/20260825172000_loyalty_v2_foundation.sql
          grep -F "GRANT EXECUTE ON FUNCTION public.admin_adjust_loyalty_points_v2(uuid, integer, text)" supabase/migrations/20260825172600_loyalty_v2_admin_adjustment_reopen.sql
          grep -F "invalid_legacy_reversal_shortfall_event" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql
          grep -F "legacy_spent_shortfall', '') ~ '^[1-9][0-9]*$'" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql
          test "$(grep -c "cached_balance_mismatch' AS check_name" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql)" -eq 1
          test "$(grep -c "duplicate_order_point_events' AS check_name" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql)" -eq 1
          test "$(grep -c "authenticated_staff_redeem_execute_expected_true" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql)" -eq 1

      - name: Remove one-shot helpers and commit
        run: |
          rm -f tools/patch-loyalty-cutover-order-and-audit.cjs
          rm -f .github/workflows/loyalty-v2-cutover-order-audit-once.yml
          git config user.name "JOKO TODAY"
          git config user.email "jokotoday@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit" >&2
            exit 1
          fi
          git commit -m "fix: make loyalty cutover ordering atomic"
          git push origin HEAD:feat/loyalty-v2-foundation-20260825
