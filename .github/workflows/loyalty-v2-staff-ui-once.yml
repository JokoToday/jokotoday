name: Loyalty v2 staff UI one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch staff desk pages
        run: |
          python3 scripts/fix-loyalty-staff-patch.py
          python3 scripts/patch-loyalty-staff-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          code=$?
          echo "AUDIT_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-staff-ui-once.yml scripts/patch-loyalty-staff-ui.py scripts/fix-loyalty-staff-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/WalkInDeskPage.tsx src/pages/PickupDeskPage.tsx .github/workflows/loyalty-v2-staff-ui-once.yml scripts/patch-loyalty-staff-ui.py scripts/fix-loyalty-staff-patch.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "feat: wire loyalty rewards into staff payment flows"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
