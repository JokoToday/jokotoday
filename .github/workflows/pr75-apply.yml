name: PR75 Apply UX Fixes

on:
  push:
    branches:
      - fix/checkout-product-modal-polish-20260902

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkout-product-modal-polish-20260902
          fetch-depth: 0

      - name: Apply UX fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # CartContext: allow callers to suppress automatic drawer opening.
          patch(
              'src/context/CartContext.tsx',
              "export type CartItem = {\n  product: CartProduct;\n  quantity: number;\n};\n\ntype CartContextType = {",
              "export type CartItem = {\n  product: CartProduct;\n  quantity: number;\n};\n\nexport type AddToCartOptions = {\n  openCart?: boolean;\n};\n\ntype CartContextType = {",
          )
          patch(
              'src/context/CartContext.tsx',
              "  addToCart: (product: CartProduct, quantity: number) => void;",
              "  addToCart: (product: CartProduct, quantity: number, options?: AddToCartOptions) => void;",
          )
          patch(
              'src/context/CartContext.tsx',
              "  const addToCart = (product: CartProduct, quantity: number) => {",
              "  const addToCart = (product: CartProduct, quantity: number, options: AddToCartOptions = {}) => {",
          )
          patch(
              'src/context/CartContext.tsx',
              "    setIsCartOpen(true);\n  };",
              "    if (options.openCart !== false) setIsCartOpen(true);\n  };",
          )

          # Product detail: don't overlay the cart; show clear inline success feedback.
          patch(
              'src/components/ProductDetailModal.tsx',
              "import { X, Plus, Minus, Heart } from 'lucide-react';",
              "import { CheckCircle2, X, Plus, Minus, Heart } from 'lucide-react';",
          )
          patch(
              'src/components/ProductDetailModal.tsx',
              "  const [isLikeAnimating, setIsLikeAnimating] = useState(false);",
              "  const [isLikeAnimating, setIsLikeAnimating] = useState(false);\n  const [justAdded, setJustAdded] = useState(false);",
          )
          patch(
              'src/components/ProductDetailModal.tsx',
              "      setQuantity(1);\n    } else {",
              "      setQuantity(1);\n      setJustAdded(false);\n    } else {",
          )
          patch(
              'src/components/ProductDetailModal.tsx',
              "  const handleAddToCart = () => {\n    addToCart(product, quantity);\n    setQuantity(1);\n    onClose();\n  };",
              "  const handleAddToCart = () => {\n    addToCart(product, quantity, { openCart: false });\n    setQuantity(1);\n    setJustAdded(true);\n    window.setTimeout(() => setJustAdded(false), 1800);\n  };",
          )
          patch(
              'src/components/ProductDetailModal.tsx',
              "  const basketFit = getBasketFit?.(quantity) ?? null;",
              "  const basketFit = getBasketFit?.(quantity) ?? null;\n  const addedLabel = language === 'th'\n    ? 'เพิ่มลงตะกร้าแล้ว'\n    : language === 'zh'\n      ? '已加入购物车'\n      : 'Added to cart';",
          )
          patch(
              'src/components/ProductDetailModal.tsx',
              "                  <button\n                    onClick={handleAddToCart}\n                    className=\"w-full bg-primary-600 text-white py-3.5 rounded-lg font-semibold text-lg hover:bg-primary-700 transition-colors shadow-md hover:shadow-lg\"\n                  >\n                    {t.product.addToCart} - ฿{product.price * quantity}\n                  </button>",
              "                  <button\n                    onClick={handleAddToCart}\n                    disabled={justAdded}\n                    className={`w-full py-3.5 rounded-lg font-semibold text-lg transition-colors shadow-md ${justAdded ? 'bg-emerald-600 text-white' : 'bg-primary-600 text-white hover:bg-primary-700 hover:shadow-lg'}`}\n                  >\n                    {justAdded ? (\n                      <span className=\"inline-flex items-center justify-center gap-2\">\n                        <CheckCircle2 className=\"w-5 h-5\" />\n                        {addedLabel}\n                      </span>\n                    ) : (\n                      `${t.product.addToCart} - ฿${product.price * quantity}`\n                    )}\n                  </button>",
          )

          # Product pickup modal: bounded internal scroll, fixed header/footer.
          patch(
              'src/components/ProductPickupCalendarModalV2.tsx',
              "    <div className=\"fixed inset-0 z-[70] flex items-start justify-center overflow-y-auto px-4 py-8\">\n      <div className=\"fixed inset-0 bg-black/60 backdrop-blur-sm\" onClick={onClose} />\n      <div className=\"relative w-full max-w-3xl rounded-2xl bg-white shadow-2xl overflow-hidden\">",
              "    <div className=\"fixed inset-0 z-[70] flex items-center justify-center px-3 sm:px-4 py-3 sm:py-4\">\n      <div className=\"fixed inset-0 bg-black/60 backdrop-blur-sm\" onClick={onClose} />\n      <div className=\"relative flex max-h-[calc(100dvh-1.5rem)] sm:max-h-[calc(100dvh-2rem)] w-full max-w-3xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl\">",
          )
          patch(
              'src/components/ProductPickupCalendarModalV2.tsx',
              "        <div className=\"flex items-start justify-between gap-4 border-b border-gray-100 px-5 sm:px-6 py-5\">",
              "        <div className=\"shrink-0 flex items-start justify-between gap-4 border-b border-gray-100 px-5 sm:px-6 py-5\">",
          )
          patch(
              'src/components/ProductPickupCalendarModalV2.tsx',
              "        <div className=\"px-4 sm:px-6 pt-5\">",
              "        <div className=\"min-h-0 flex-1 overflow-y-auto overscroll-contain px-4 sm:px-6 pt-5\">",
          )
          patch(
              'src/components/ProductPickupCalendarModalV2.tsx',
              "        <div className=\"sticky bottom-0 border-t border-gray-100 bg-white/95 backdrop-blur px-5 sm:px-6 py-4\">",
              "        <div className=\"shrink-0 border-t border-gray-100 bg-white/95 backdrop-blur px-5 sm:px-6 py-4\">",
          )

          # Pickup selector: make the essential location confirmation a real CTA.
          patch(
              'src/components/PickupDateSelectorV2.tsx',
              "                            {canSelectLocation && !isLocationSelected && (\n                              <p className=\"text-xs font-medium text-amber-700 mt-1.5\">\n                                {language === 'th' ? 'เลือกสถานที่นี้' : language === 'zh' ? '选择此地点' : 'Use this location'}\n                              </p>\n                            )}",
              "                            {canSelectLocation && (\n                              <span className={`mt-3 inline-flex w-full items-center justify-center gap-2 rounded-lg px-3 py-2.5 text-sm font-semibold ${isLocationSelected ? 'border border-amber-300 bg-amber-100 text-amber-900' : 'bg-amber-600 text-white shadow-sm'}`}>\n                                {isLocationSelected && <CheckCircle2 className=\"w-4 h-4\" />}\n                                {isLocationSelected\n                                  ? (language === 'th' ? 'เลือกแล้ว' : language === 'zh' ? '已选择' : 'Selected')\n                                  : (language === 'th' ? 'ใช้สถานที่นี้' : language === 'zh' ? '使用此地点' : 'Use this location')}\n                              </span>\n                            )}",
          )

          # Recommendations: product detail navigation + no cart drawer on checkout add.
          patch(
              'src/components/FitsYourPickupV2.tsx',
              "interface FitsYourPickupV2Props {\n  pickupDateId: string;\n  placement?: RecommendationPlacement;\n}",
              "interface FitsYourPickupV2Props {\n  pickupDateId: string;\n  placement?: RecommendationPlacement;\n  onProductClick?: (product: CMSProduct) => void;\n}",
          )
          patch(
              'src/components/FitsYourPickupV2.tsx',
              "export function FitsYourPickupV2({ pickupDateId, placement = 'cart' }: FitsYourPickupV2Props) {",
              "export function FitsYourPickupV2({ pickupDateId, placement = 'cart', onProductClick }: FitsYourPickupV2Props) {",
          )
          patch(
              'src/components/FitsYourPickupV2.tsx',
              "  const addLabel = getLabel(\n    'fits_your_pickup.add',\n    language,\n    language === 'th' ? 'เพิ่ม' : language === 'zh' ? '添加' : 'Add',\n  );",
              "  const addLabel = getLabel(\n    'fits_your_pickup.add',\n    language,\n    language === 'th' ? 'เพิ่ม' : language === 'zh' ? '添加' : 'Add',\n  );\n  const viewDetailsLabel = getLabel(\n    'recommendations.view_details',\n    language,\n    language === 'th' ? 'ดูรายละเอียด' : language === 'zh' ? '查看详情' : 'View details',\n  );",
          )
          patch(
              'src/components/FitsYourPickupV2.tsx',
              "              <img\n                src={productImage(product)}\n                alt={name}\n                className=\"w-12 h-12 rounded-md object-cover shrink-0\"\n                loading=\"lazy\"\n              />\n              <div className=\"min-w-0 flex-1\">\n                <p className=\"text-sm font-semibold text-gray-900 truncate\">{name}</p>\n                <div className=\"flex items-center gap-2 mt-0.5\">\n                  <span className=\"text-xs font-medium text-primary-800\">฿{product.price}</span>\n                  <span className=\"text-[11px] text-gray-500\">\n                    {language === 'th'\n                      ? `เหลือ ${remaining}`\n                      : language === 'zh'\n                        ? `剩余 ${remaining}`\n                        : `${remaining} available`}\n                  </span>\n                </div>\n              </div>",
              "              <button\n                type=\"button\"\n                onClick={() => onProductClick?.(product)}\n                disabled={!onProductClick}\n                className={`min-w-0 flex flex-1 items-center gap-3 rounded-md text-left ${onProductClick ? 'hover:bg-amber-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-400' : 'cursor-default'}`}\n              >\n                <img\n                  src={productImage(product)}\n                  alt={name}\n                  className=\"w-12 h-12 rounded-md object-cover shrink-0\"\n                  loading=\"lazy\"\n                />\n                <div className=\"min-w-0 flex-1\">\n                  <p className=\"text-sm font-semibold text-gray-900 truncate\">{name}</p>\n                  <div className=\"flex items-center gap-2 mt-0.5\">\n                    <span className=\"text-xs font-medium text-primary-800\">฿{product.price}</span>\n                    <span className=\"text-[11px] text-gray-500\">\n                      {language === 'th'\n                        ? `เหลือ ${remaining}`\n                        : language === 'zh'\n                          ? `剩余 ${remaining}`\n                          : `${remaining} available`}\n                    </span>\n                  </div>\n                  {onProductClick && <p className=\"mt-1 text-[11px] font-semibold text-amber-700\">{viewDetailsLabel}</p>}\n                </div>\n              </button>",
          )
          patch(
              'src/components/FitsYourPickupV2.tsx',
              "                onClick={() => addToCart(product, 1)}",
              "                onClick={() => addToCart(product, 1, { openCart: !isCheckout })}",
          )

          # Checkout: clickable recommendation details + explicit continue-shopping action before Place Order.
          patch(
              'src/pages/CheckoutPageV2.tsx',
              "import { ProfileCompletionModal } from '../components/ProfileCompletionModal';",
              "import { ProfileCompletionModal } from '../components/ProfileCompletionModal';\nimport { useCMSLabels } from '../hooks/useCMSLabels';\nimport { CMSProduct } from '../lib/cmsService';",
          )
          patch(
              'src/pages/CheckoutPageV2.tsx',
              "  const { language, t } = useLanguage();",
              "  const { language, t } = useLanguage();\n  const { getLabel } = useCMSLabels();",
          )
          patch(
              'src/pages/CheckoutPageV2.tsx',
              "  const backToCart = () => {\n    onNavigate('products');\n    window.setTimeout(() => setIsCartOpen(true), 0);\n  };",
              "  const backToCart = () => {\n    onNavigate('products');\n    window.setTimeout(() => setIsCartOpen(true), 0);\n  };\n\n  const continueShopping = () => {\n    setIsCartOpen(false);\n    onNavigate('products');\n  };\n\n  const openRecommendedProduct = (product: CMSProduct) => {\n    setIsCartOpen(false);\n    if (product.slug) {\n      onNavigate(`product/${product.slug}`);\n      return;\n    }\n    onNavigate('products');\n  };",
          )
          patch(
              'src/pages/CheckoutPageV2.tsx',
              "  const cancelChangeLabel = language === 'th' ? 'ยกเลิกการเปลี่ยนแปลง' : language === 'zh' ? '取消更改' : 'Cancel pickup change';",
              "  const cancelChangeLabel = language === 'th' ? 'ยกเลิกการเปลี่ยนแปลง' : language === 'zh' ? '取消更改' : 'Cancel pickup change';\n  const forgotSomethingLabel = getLabel(\n    'checkout.continue_shopping',\n    language,\n    language === 'th' ? 'ลืมอะไรไหม? เลือกซื้อสินค้าต่อ' : language === 'zh' ? '忘了什么吗？继续选购' : 'Forgot something? Continue shopping',\n  );",
          )
          patch(
              'src/pages/CheckoutPageV2.tsx',
              "              <FitsYourPickupV2 pickupDateId={selection.pickupDateId} placement=\"checkout\" />",
              "              <FitsYourPickupV2\n                pickupDateId={selection.pickupDateId}\n                placement=\"checkout\"\n                onProductClick={openRecommendedProduct}\n              />",
          )
          patch(
              'src/pages/CheckoutPageV2.tsx',
              "            <button\n              type=\"submit\"\n              disabled={isSubmitting || !selection}",
              "            <button\n              type=\"button\"\n              onClick={continueShopping}\n              className=\"w-full border border-amber-200 bg-white text-amber-900 py-3 rounded-lg font-semibold hover:bg-amber-50 transition-colors\"\n            >\n              {forgotSomethingLabel}\n            </button>\n\n            <button\n              type=\"submit\"\n              disabled={isSubmitting || !selection}",
          )
          PY

      - name: Commit fixes and remove helper
        run: |
          git config user.name "JOKO TODAY"
          git config user.email "jokotoday@gmail.com"
          git rm .github/workflows/pr75-apply.yml
          git add src/context/CartContext.tsx src/components/ProductDetailModal.tsx src/components/ProductPickupCalendarModalV2.tsx src/components/PickupDateSelectorV2.tsx src/components/FitsYourPickupV2.tsx src/pages/CheckoutPageV2.tsx
          git commit -m "fix: clarify pickup and checkout interactions"
          git push origin HEAD:fix/checkout-product-modal-polish-20260902
