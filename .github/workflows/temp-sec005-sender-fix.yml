name: Temporary SEC-005 sender fix

on:
  push:
    branches:
      - fix/sec005-order-email-sender-domain

permissions:
  contents: write

jobs:
  patch-senders:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sec005-order-email-sender-domain

      - name: Patch sender domains
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/functions/send-order-confirmation/index.ts
            supabase/functions/send-admin-order-notification/index.ts
          )

          before=$(grep -h -o 'orders@jokotoday\.com' "${files[@]}" | wc -l)
          if [ "$before" -ne 2 ]; then
            echo "Expected exactly 2 old sender references, found $before"
            exit 1
          fi

          sed -i 's/orders@jokotoday\.com/orders@joko.today/g' "${files[@]}"

          after_old=$(grep -h -o 'orders@jokotoday\.com' "${files[@]}" | wc -l || true)
          after_new=$(grep -h -o 'orders@joko\.today' "${files[@]}" | wc -l)
          if [ "$after_old" -ne 0 ] || [ "$after_new" -ne 2 ]; then
            echo "Sender replacement validation failed"
            exit 1
          fi

          changed=$(git diff --name-only -- "${files[@]}" | wc -l)
          if [ "$changed" -ne 2 ]; then
            echo "Expected exactly 2 changed files, found $changed"
            git diff --name-only
            exit 1
          fi

          git diff --check -- "${files[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'fix: use verified joko.today order sender'
          git push origin HEAD:fix/sec005-order-email-sender-domain
