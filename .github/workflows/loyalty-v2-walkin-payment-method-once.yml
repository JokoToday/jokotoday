name: Loyalty v2 Walk-In payment-method one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Walk-In payment method integrity
        run: python3 scripts/patch-loyalty-walkin-payment-method.py

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Payment-method assertions
        shell: bash
        run: |
          grep -q "p_payment_method text" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "staff_repair_completed_order_payment_method_v2" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql
          grep -q "p_payment_method: paymentMethod" src/pages/WalkInDeskPage.tsx
          grep -q "staff_repair_completed_order_payment_method_v2" src/components/staff/CustomerPurchaseHistory.tsx
          grep -q "paid_walk_in_missing_payment_method" supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-walkin-payment-method-once.yml scripts/patch-loyalty-walkin-payment-method.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql supabase/audits/20260826_loyalty_v2_staff_fulfillment.sql src/pages/WalkInDeskPage.tsx src/components/staff/CustomerPurchaseHistory.tsx .github/workflows/loyalty-v2-walkin-payment-method-once.yml scripts/patch-loyalty-walkin-payment-method.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Walk-In payment-method changes to commit"
            exit 1
          fi
          git commit -m "fix: capture Walk-In payment method atomically"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
