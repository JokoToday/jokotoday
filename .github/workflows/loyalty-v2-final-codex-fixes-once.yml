name: Loyalty v2 final Codex fixes one-shot

on:
  push:
    branches:
      - feat/loyalty-v2-staff-fulfillment-20260826

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loyalty-v2-staff-fulfillment-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch final Codex findings
        run: python3 scripts/patch-loyalty-payment-null-and-repair-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Final payment assertions
        shell: bash
        run: |
          test "$(grep -c "p_payment_method IS NULL OR p_payment_method NOT IN ('cash', 'qr_code')" supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql)" -eq 3
          grep -q "order.payment_status === 'paid' && !paymentComplete" src/components/staff/CustomerPurchaseHistory.tsx
          grep -q "\['cash', 'qr_code', 'qr'\].includes(order.payment_method ?? '')" src/components/staff/CustomerPurchaseHistory.tsx

      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/loyalty-v2-final-codex-fixes-once.yml scripts/patch-loyalty-payment-null-and-repair-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260826021421_loyalty_v2_staff_fulfillment.sql src/components/staff/CustomerPurchaseHistory.tsx .github/workflows/loyalty-v2-final-codex-fixes-once.yml scripts/patch-loyalty-payment-null-and-repair-ui.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final Codex fixes to commit"
            exit 1
          fi
          git commit -m "fix: reject null payment methods and tighten repair UI"
          git push origin HEAD:feat/loyalty-v2-staff-fulfillment-20260826
