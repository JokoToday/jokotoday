    <path d="M1194-20c119 80 169 186 154 309-13 106 36 180 135 241 57 35 96 82 117 141v-691Z" fill="#DCE9EC" opacity=".16"/>
    <path d="M-35 305c103 7 172 57 208 146 29 71 80 112 153 132 37 10 71 29 101 57-165-29-299-21-462 34Z" fill="#F4EFE5" opacity=".11"/>
  </g>

