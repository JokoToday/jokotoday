<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" fill="none">
  <defs>
    <filter id="softRough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.45" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="washA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FCFC9" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#DCE9EC" stop-opacity=".07"/>
      <stop offset="1" stop-color="#7FB7AF" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="washB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EFE5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8ABCB5" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <!-- broad irregular mineral washes -->
  <g opacity=".9">
    <path d="M-70 78C118 9 238 57 382 84c175 33 280-76 471-35 185 40 315 79 480 25 110-37 219-68 338-22l10 156c-183-24-310 39-469 7-173-34-292-83-461-35-145 41-246 22-397-20C193 116 53 171-54 205Z" fill="url(#washA)"/>
