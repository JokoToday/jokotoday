project_id = "jokotoday"

# Edge Function JWT verification modes mirrored from production on 2026-08-20.
# Customer-facing order notification functions require JWT authentication.
# The remaining public-function modes are preserved here pending the separate full Edge Function audit.

[functions.customer-lookup]
verify_jwt = true

[functions.qr-login]
verify_jwt = false

[functions.regenerate-qr]
verify_jwt = true

[functions.request-vip-magic-link]
verify_jwt = true

[functions.send-auth-email]
verify_jwt = false

[functions.send-order-confirmation]
verify_jwt = true

[functions.send-order-cancellation]
verify_jwt = true

[functions.send-admin-order-notification]
verify_jwt = true

[functions.generate-character-candidates]
verify_jwt = true

[functions.joko-media-upload-url]
verify_jwt = true

[functions.product-staff-products]
verify_jwt = true

# Server-to-server OpenAI-compatible routing gateway. Platform JWT verification
# is disabled because Hermes authenticates with JOKO_AI_GATEWAY_KEY; the
# function performs its own bearer-key validation before exposing any route.
[functions.joko-ai-gateway]
verify_jwt = false


[functions.create-payment-handoff]
verify_jwt = true

[functions.payment-handoff-status]
verify_jwt = false

# This function performs its own authentication. Normal browser uploads are
# validated against the signed-in user; mobile handoff uploads are validated
# against a short-lived, hashed bearer token tied to one payment transaction.
[functions.verify-payment-slip]
verify_jwt = false

[functions.stripe-promptpay-intent]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.admin-stripe-test-payment]
verify_jwt = true

# Dedicated internal bearer secret is checked by the dispatcher; no browser send API.
[functions.dispatch-customer-notifications]
verify_jwt = false

# LINE authenticates exact raw bytes with x-line-signature.
[functions.line-oa-webhook]
verify_jwt = false

[functions.sync-line-oa-friendship]
verify_jwt = true
