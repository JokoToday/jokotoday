project_id = "jokotoday"

# Edge Function JWT verification modes mirrored from production on 2026-08-20.
# Customer-facing order notification functions require JWT authentication.
# The remaining public-function modes are preserved here pending the separate full Edge Function audit.

[functions.customer-lookup]
verify_jwt = true

[functions.qr-login]
verify_jwt = false

[functions.regenerate-qr]
verify_jwt = true

[functions.request-vip-magic-link]
verify_jwt = true

[functions.send-auth-email]
verify_jwt = false

[functions.send-order-confirmation]
verify_jwt = true

[functions.send-order-cancellation]
verify_jwt = true

[functions.send-admin-order-notification]
verify_jwt = true

[functions.generate-character-candidates]
verify_jwt = true

[functions.joko-media-upload-url]
verify_jwt = true

[functions.product-staff-products]
verify_jwt = true

# Server-to-server OpenAI-compatible routing gateway. Platform JWT verification
# is disabled because Hermes authenticates with JOKO_AI_GATEWAY_KEY; the
# function performs its own bearer-key validation before exposing any route.
[functions.joko-ai-gateway]
verify_jwt = false


# Cross-device payment handoff.
# Creation requires the signed-in customer. The resolver/uploader authenticate
# with a 256-bit short-lived bearer token whose SHA-256 hash is stored in DB.
[functions.create-payment-handoff]
verify_jwt = true

[functions.resolve-payment-handoff]
verify_jwt = false

[functions.verify-payment-handoff-slip]
verify_jwt = false
